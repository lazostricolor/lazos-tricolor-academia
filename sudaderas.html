<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudadera — Lazos Tricolor</title>
<style>
  :root{ --indigo:#4f46e5; --indigo-700:#4338ca; --ink:#1e2233; --muted:#6b7280;
         --line:#e5e7eb; --bg:#f6f7fb; --green:#16a34a; --green-bg:#dcfce7;
         --amber:#b45309; --amber-bg:#fef3c7; --gray-bg:#f1f3f6; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);
       color:var(--ink);padding:16px;line-height:1.5}
  .wrap{max-width:460px;margin:0 auto}
  .head{background:var(--indigo-700);color:#fff;border-radius:16px;padding:18px 18px;margin-bottom:14px}
  .head h1{font-size:17px;font-weight:700}
  .head p{color:#c7d2fe;font-size:12.5px;margin-top:3px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .niña{font-size:19px;font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .total{margin-top:10px;font-size:14px}
  .total b{font-size:16px}
  .cuotas{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .cuota{display:flex;justify-content:space-between;align-items:center;
         border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .cuota .n{font-weight:600;font-size:14px}
  .cuota .f{color:var(--muted);font-size:12px}
  .cuota .v{font-variant-numeric:tabular-nums;font-weight:600}
  .badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
  .b-paid{background:var(--green-bg);color:var(--green)}
  .b-check{background:var(--amber-bg);color:var(--amber)}
  .b-pend{background:var(--gray-bg);color:var(--muted)}
  .b-late{background:#fee2e2;color:#dc2626}
  .pay{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .pay h3{font-size:15px;margin-bottom:4px}
  .pay .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .drop{border:2px dashed #c7cbd6;border-radius:12px;padding:20px;text-align:center;
        color:var(--muted);font-size:13px;cursor:pointer;background:#fafbfc}
  .drop.has{border-color:var(--indigo);color:var(--indigo-700);background:var(--indigo-700);color:#fff}
  #preview{max-width:100%;border-radius:10px;margin-top:12px;display:none}
  .btn{width:100%;margin-top:14px;background:var(--indigo);color:#fff;border:none;
       padding:13px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:12px;font-size:13px;text-align:center;min-height:18px}
  .ok{color:var(--green);font-weight:600}
  .err{color:#dc2626;font-weight:600}
  .done{text-align:center;padding:24px 12px}
  .done .big{font-size:40px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Sudadera oficial — Lazos Tricolor</h1>
    <p>Pago en 3 cuotas · Entrega: primera quincena de noviembre</p>
  </div>
  <div id="app"><div class="card">Cargando…</div></div>
  <div class="foot">Academia de Danzas Lazos Tricolor · Soacha</div>
</div>

<!-- Firebase (SDK compat, funciona con el estilo firebase.firestore()) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="sudaderas.js"></script>
<script>
/* ============================================================
   1) PEGA AQUÍ TU CONFIG DE FIREBASE (la misma de tu firebase.js).
      No es secreta: está pensada para ir en el navegador.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCIj32zyCreKyCGJSMo6T5yTDhMeqctpG4",
  authDomain: "lazos-tricolor-academia.firebaseapp.com",
  projectId: "lazos-tricolor-academia",
  storageBucket: "lazos-tricolor-academia.firebasestorage.app",
  messagingSenderId: "284048193120",
  appId: "1:284048193120:web:96cacf134a537c9ad57505",
  measurementId: "G-17YZN5KNLZ"
};

/* Para ENSAYAR ya, sin cuenta de Cloudinary, dejamos la foto dentro de
   Firebase (base64). Cuando quieras pasar a Cloudinary, pon true y
   configura CLOUDINARY_CLOUD / CLOUDINARY_PRESET en sudaderas.js */
const USAR_CLOUDINARY = false;

firebase.initializeApp(firebaseConfig);

const app = document.getElementById('app');
const id  = new URLSearchParams(location.search).get('id');
let archivo = null, registro = null, cuotaN = null;

const BADGE = {
  pagado:        ['Pagado ✓',    'b-paid'],
  por_verificar: ['En revisión', 'b-check'],
  vencida:       ['Vencida',     'b-late'],
  pendiente:     ['Pendiente',   'b-pend'],
};

async function cargar(){
  if(!id){ app.innerHTML = tarjeta('Enlace incompleto', 'Pídele a la academia tu enlace personalizado.'); return; }
  try{
    registro = await Sudaderas.obtenerRegistro(id);
  }catch(e){
    app.innerHTML = tarjeta('No se pudo cargar', 'Revisa tu conexión e inténtalo de nuevo.'); return;
  }
  if(!registro){ app.innerHTML = tarjeta('No encontramos el registro', 'El enlace puede estar mal. Contacta a la academia.'); return; }
  render();
}

function tarjeta(t, p){ return `<div class="card"><div class="niña">${t}</div><div class="meta">${p}</div></div>`; }

function render(){
  cuotaN = Sudaderas.siguienteAccionable(registro);
  let filas = '';
  ['1','2','3'].forEach(n=>{
    const c = registro.cuotas[n];
    const est = Sudaderas.estadoCuota(c);
    const [txt, cls] = BADGE[est];
    filas += `<div class="cuota">
      <div><div class="n">Cuota ${n}</div><div class="f">Vence ${c.fecha}</div></div>
      <div style="text-align:right">
        <div class="v">${Sudaderas.formatoDinero(c.valor)}</div>
        <span class="badge ${cls}">${txt}</span>
      </div></div>`;
  });

  let bloquePago = '';
  if(cuotaN){
    const c = registro.cuotas[String(cuotaN)];
    bloquePago = `
      <div class="pay">
        <h3>Subir soporte — Cuota ${cuotaN}</h3>
        <div class="hint">Sube la foto o pantallazo del pago de ${Sudaderas.formatoDinero(c.valor)}.</div>
        <label class="drop" id="drop">Toca para elegir la foto del comprobante
          <input type="file" accept="image/*" id="file" hidden>
        </label>
        <img id="preview">
        <button class="btn" id="enviar" disabled>Enviar soporte</button>
        <div class="status" id="status"></div>
      </div>`;
  } else {
    bloquePago = `<div class="pay"><h3>¡Todo al día! 🎉</h3>
      <div class="hint">No tienes cuotas pendientes por ahora. Gracias.</div></div>`;
  }

  app.innerHTML = `
    <div class="card">
      <div class="niña">${registro.nombre}</div>
      <div class="meta">Talla ${registro.talla}</div>
      <div class="total">Total sudadera: <b>${Sudaderas.formatoDinero(registro.total)}</b></div>
    </div>
    <div class="card"><div class="cuotas">${filas}</div></div>
    ${bloquePago}`;

  if(cuotaN) conectarPago();
}

function conectarPago(){
  const file = document.getElementById('file');
  const drop = document.getElementById('drop');
  const prev = document.getElementById('preview');
  const btn  = document.getElementById('enviar');
  const st   = document.getElementById('status');

  file.addEventListener('change', ()=>{
    archivo = file.files[0] || null;
    if(archivo){
      drop.classList.add('has');
      drop.firstChild.textContent = '✓ Foto seleccionada — toca “Enviar soporte”';
      prev.src = URL.createObjectURL(archivo); prev.style.display='block';
      btn.disabled = false; st.textContent='';
    }
  });

  btn.addEventListener('click', async ()=>{
    if(!archivo) return;
    btn.disabled = true; st.className='status'; st.textContent='Comprimiendo y enviando…';
    try{
      const soporte = USAR_CLOUDINARY
        ? await Sudaderas.subirSoporteCloudinary(archivo)
        : await Sudaderas.soporteComoBase64(archivo);
      await Sudaderas.subirSoporteCuota(id, cuotaN, soporte);   // la nube confirma antes de seguir
      app.innerHTML = `<div class="card done">
        <div class="big">✅</div>
        <h3 style="margin:8px 0">¡Soporte recibido!</h3>
        <div class="meta">Quedó en revisión. La academia lo confirmará pronto.
        Puedes cerrar esta página.</div></div>`;
    }catch(e){
      st.className='status err'; st.textContent = e.message || 'No se pudo enviar. Intenta otra vez.';
      btn.disabled = false;
    }
  });
}

cargar();
</script>
</body>
</html>

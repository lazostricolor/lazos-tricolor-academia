<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudadera — Lazos Tricolor</title>
<style>
  :root{ --indigo:#4f46e5; --indigo-700:#4338ca; --ink:#1e2233; --muted:#6b7280;
         --line:#e5e7eb; --bg:#f6f7fb; --green:#16a34a; --green-bg:#dcfce7;
         --amber:#b45309; --amber-bg:#fef3c7; --gray-bg:#f1f3f6; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);
       color:var(--ink);padding:16px;line-height:1.5}
  .wrap{max-width:460px;margin:0 auto}
  .head{background:var(--indigo-700);color:#fff;border-radius:16px;padding:18px 18px;margin-bottom:14px}
  .head h1{font-size:17px;font-weight:700}
  .head p{color:#c7d2fe;font-size:12.5px;margin-top:3px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .niña{font-size:19px;font-weight:700}
  .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .total{margin-top:10px;font-size:14px}
  .total b{font-size:16px}
  .cuotas{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .cuota{display:flex;justify-content:space-between;align-items:center;
         border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .cuota .n{font-weight:600;font-size:14px}
  .cuota .f{color:var(--muted);font-size:12px}
  .cuota .v{font-variant-numeric:tabular-nums;font-weight:600}
  .badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
  .b-paid{background:var(--green-bg);color:var(--green)}
  .b-check{background:var(--amber-bg);color:var(--amber)}
  .b-pend{background:var(--gray-bg);color:var(--muted)}
  .b-late{background:#fee2e2;color:#dc2626}
  .pay{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .pay h3{font-size:15px;margin-bottom:4px}
  .pay .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .drop{border:2px dashed #c7cbd6;border-radius:12px;padding:20px;text-align:center;
        color:var(--muted);font-size:13px;cursor:pointer;background:#fafbfc}
  .drop.has{border-color:var(--indigo);color:var(--indigo-700);background:var(--indigo-700);color:#fff}
  #preview{max-width:100%;border-radius:10px;margin-top:12px;display:none}
  .tlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .topt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;
        padding:12px 13px;cursor:pointer}
  .topt.sel{border-color:var(--indigo);background:var(--indigo-50,#eef2ff)}
  .topt input{width:18px;height:18px;accent-color:var(--indigo)}
  .topt .tname{font-weight:600;font-size:14px}
  .topt .tprice{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .topt .tprice small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
  .saldo-box{margin-top:12px}
  .bar{height:10px;background:#eef0f4;border-radius:20px;overflow:hidden}
  .bar-fill{height:100%;background:var(--green);border-radius:20px;transition:width .4s}
  .saldo-nums{display:flex;flex-wrap:wrap;gap:12px 20px;margin-top:12px}
  .saldo-nums div{display:flex;flex-direction:column}
  .saldo-nums span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .saldo-nums b{font-size:16px;font-variant-numeric:tabular-nums}
  .saldo-nums b.ok{color:var(--green)} .saldo-nums b.rev{color:var(--amber)}
  .montos{display:flex;gap:8px;margin-bottom:12px}
  .mbtn{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 6px;
        cursor:pointer;font-size:13px;font-weight:600;line-height:1.2;text-align:center}
  .mbtn small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:3px}
  .mbtn.sel{border-color:var(--indigo);background:var(--indigo-50,#eef2ff);color:var(--indigo-700)}
  #montoInput{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px;margin-bottom:12px;text-align:center;font-weight:600}
  .step{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin-bottom:8px}
  .stnum{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
         background:var(--indigo);color:#fff;font-size:12px}
  .foto-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px}
  .foto-card img{max-width:100%;border-radius:8px;display:block}
  .foto-acts{display:flex;gap:8px;margin-top:8px}
  .mini{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;font-size:13px;
        font-weight:600;cursor:pointer;color:var(--ink)}
  .mini.danger{color:#dc2626;border-color:#fecaca}
  .resumen{background:#eef2ff;border:1px solid #c7d2fe;color:var(--indigo-700,#4338ca);border-radius:11px;
           padding:11px 13px;font-size:13px;margin-bottom:12px}
  .anular{background:none;border:none;color:#dc2626;font-size:12px;font-weight:600;cursor:pointer;padding:0}
  .btn{width:100%;margin-top:14px;background:var(--indigo);color:#fff;border:none;
       padding:13px;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .status{margin-top:12px;font-size:13px;text-align:center;min-height:18px}
  .ok{color:var(--green);font-weight:600}
  .err{color:#dc2626;font-weight:600}
  .done{text-align:center;padding:24px 12px}
  .done .big{font-size:40px}
  .foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Sudadera oficial — Lazos Tricolor</h1>
    <p>Pago en 3 cuotas · Entrega: primera quincena de noviembre</p>
  </div>
  <div id="app"><div class="card">Cargando…</div></div>
  <div class="foot">Academia de Danzas Lazos Tricolor · Soacha</div>
</div>

<!-- Firebase (SDK compat, funciona con el estilo firebase.firestore()) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="sudaderas.js"></script>
<script>
/* ============================================================
   1) PEGA AQUÍ TU CONFIG DE FIREBASE (la misma de tu firebase.js).
      No es secreta: está pensada para ir en el navegador.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCIj32zyCreKyCGJSMo6T5yTDhMeqctpG4",
  authDomain: "lazos-tricolor-academia.firebaseapp.com",
  projectId: "lazos-tricolor-academia",
  storageBucket: "lazos-tricolor-academia.firebasestorage.app",
  messagingSenderId: "284048193120",
  appId: "1:284048193120:web:96cacf134a537c9ad57505",
  measurementId: "G-17YZN5KNLZ"
};

/* Para ENSAYAR ya, sin cuenta de Cloudinary, dejamos la foto dentro de
   Firebase (base64). Cuando quieras pasar a Cloudinary, pon true y
   configura CLOUDINARY_CLOUD / CLOUDINARY_PRESET en sudaderas.js */
const USAR_CLOUDINARY = false;

firebase.initializeApp(firebaseConfig);

const app = document.getElementById('app');
const id  = new URLSearchParams(location.search).get('id');
let archivo = null, registro = null, cuotaN = null, flashMsg = '';

const BADGE = {
  pagado:        ['Pagado ✓',    'b-paid'],
  por_verificar: ['En revisión', 'b-check'],
  vencida:       ['Vencida',     'b-late'],
  pendiente:     ['Pendiente',   'b-pend'],
};

async function cargar(){
  if(!id){ app.innerHTML = tarjeta('Enlace incompleto', 'Pídele a la academia tu enlace personalizado.'); return; }
  try{
    registro = await Sudaderas.obtenerRegistro(id);
  }catch(e){
    app.innerHTML = tarjeta('No se pudo cargar', 'Revisa tu conexión e inténtalo de nuevo.'); return;
  }
  if(!registro){ app.innerHTML = tarjeta('No encontramos el registro', 'El enlace puede estar mal. Contacta a la academia.'); return; }
  render();
}

function tarjeta(t, p){ return `<div class="card"><div class="niña">${t}</div><div class="meta">${p}</div></div>`; }

function render(){
  if(!registro.talla){ renderTalla(); return; }

  const total    = registro.total || 0;
  const pagado   = Sudaderas.pagado(registro);
  const revision = Sudaderas.enRevision(registro);
  const saldo    = Sudaderas.saldo(registro);
  const pct      = total ? Math.min(100, Math.round(pagado / total * 100)) : 0;
  const abonos   = Sudaderas.listaAbonos(registro);

  const hist = abonos.length ? abonos.map(a=>{
    const aprobado = a.estado==='aprobado';
    const [txt,cls] = aprobado ? ['Aprobado ✓','b-paid'] : ['En revisión','b-check'];
    const fs = new Date(a.fecha||Date.now()).toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
    const anular = aprobado ? '' : `<button class="anular" data-anular="${a.id}">✕ Anular</button>`;
    return `<div class="cuota">
      <div><div class="n">${Sudaderas.formatoDinero(a.monto)}</div><div class="f">${fs}</div></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge ${cls}">${txt}</span>${anular}
      </div></div>`;
  }).join('') : `<div class="hint">Aún no has registrado ningún pago.</div>`;

  let bloquePago;
  if(saldo>0){
    const tercio = Math.round(total/3);
    bloquePago = `
      <div class="pay">
        <h3>Hacer un pago</h3>

        <div class="step"><span class="stnum">1</span> ¿Cuánto vas a pagar?</div>
        <div class="montos">
          <button class="mbtn" data-monto="${saldo}">Todo el saldo<small>${Sudaderas.formatoDinero(saldo)}</small></button>
          ${tercio<saldo?`<button class="mbtn" data-monto="${tercio}">Un tercio<small>${Sudaderas.formatoDinero(tercio)}</small></button>`:''}
          <button class="mbtn" data-monto="otro">Otro monto<small>tú eliges</small></button>
        </div>
        <input id="montoInput" type="tel" inputmode="numeric" placeholder="Escribe el monto" style="display:none">

        <div class="step" style="margin-top:14px"><span class="stnum">2</span> Foto del comprobante <span style="font-weight:400;color:var(--muted)">(opcional)</span></div>
        <div class="hint" style="margin-bottom:8px">Si aún no tienes el comprobante, puedes enviar el pago sin foto y adjuntarla después.</div>
        <label class="drop" id="drop">📷 Toca para elegir la foto
          <input type="file" accept="image/*" id="file" hidden>
        </label>
        <div id="fotoCard" class="foto-card" style="display:none">
          <img id="preview">
          <div class="foto-acts">
            <button class="mini" id="cambiarFoto">Cambiar</button>
            <button class="mini danger" id="quitarFoto">✕ Quitar</button>
          </div>
        </div>

        <div id="resumen" class="resumen" style="display:none"></div>
        <button class="btn" id="enviar" disabled>Enviar pago</button>
        <div class="status" id="status"></div>
      </div>`;
  } else {
    bloquePago = `<div class="pay"><h3>¡Sudadera pagada! 🎉</h3>
      <div class="hint">Ya completaste el pago. Entrega: primera quincena de noviembre. ¡Gracias!</div></div>`;
  }

  const flash = flashMsg
    ? `<div class="card" style="background:var(--green-bg);border-color:#bbf7d0;color:var(--green);font-weight:600">${flashMsg}</div>`
    : '';
  flashMsg = '';

  app.innerHTML = `
    ${flash}
    <div class="card">
      <div class="niña">${registro.nombre}</div>
      <div class="meta">Talla ${registro.talla}</div>
      <div class="saldo-box">
        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="saldo-nums">
          <div><span>Total</span><b>${Sudaderas.formatoDinero(total)}</b></div>
          <div><span>Pagado</span><b class="ok">${Sudaderas.formatoDinero(pagado)}</b></div>
          ${revision?`<div><span>En revisión</span><b class="rev">${Sudaderas.formatoDinero(revision)}</b></div>`:''}
          <div><span>Saldo</span><b>${Sudaderas.formatoDinero(saldo)}</b></div>
        </div>
      </div>
    </div>
    <div class="card"><h3 style="font-size:14px;margin-bottom:10px">Mis pagos</h3><div class="cuotas">${hist}</div></div>
    ${bloquePago}`;

  if(saldo>0) conectarPago(saldo);
}

/* Pantalla para que el papá elija la talla (registro sin talla aún). */
function renderTalla(){
  const opts = Object.keys(Sudaderas.TALLAS).map(t=>{
    const p = Sudaderas.TALLAS[t];
    return `<label class="topt">
      <input type="radio" name="talla" value="${t}">
      <span class="tname">Talla ${t}</span>
      <span class="tprice">${Sudaderas.formatoDinero(p.total)}<small>o en partes</small></span>
    </label>`;
  }).join('');
  app.innerHTML = `
    <div class="card">
      <div class="niña">${registro.nombre}</div>
      <div class="meta">Elige la talla de la sudadera</div>
    </div>
    <div class="card">
      <div class="tlist">${opts}</div>
      <button class="btn" id="confTalla" disabled>Confirmar talla</button>
      <div class="status" id="stTalla"></div>
      <div class="hint" style="margin-top:8px">Después de confirmar podrás registrar tus pagos (todo de una o en partes).</div>
    </div>`;
  app.querySelectorAll('input[name=talla]').forEach(r=>{
    r.addEventListener('change', ()=>{
      document.getElementById('confTalla').disabled = false;
      app.querySelectorAll('.topt').forEach(l=>l.classList.remove('sel'));
      r.closest('.topt').classList.add('sel');
    });
  });
  document.getElementById('confTalla').addEventListener('click', async ()=>{
    const sel = app.querySelector('input[name=talla]:checked'); if(!sel) return;
    const btn = document.getElementById('confTalla'); const st = document.getElementById('stTalla');
    btn.disabled = true; st.className='status'; st.textContent = 'Guardando…';
    try{
      await Sudaderas.asignarTalla(id, sel.value);      // la nube confirma
      registro = await Sudaderas.obtenerRegistro(id);   // recargar con cuotas ya creadas
      flashMsg = `✅ Talla ${sel.value} guardada. Ya puedes registrar tus pagos cuando quieras — no tienes que hacerlo ahora.`;
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    }catch(e){
      st.className='status err'; st.textContent = 'No se pudo guardar. Intenta de nuevo.';
      btn.disabled = false;
    }
  });
}

function conectarPago(saldoMax){
  const g = id => document.getElementById(id);
  const file=g('file'), drop=g('drop'), prev=g('preview'), btn=g('enviar'), st=g('status');
  const montoInput=g('montoInput'), fotoCard=g('fotoCard'), resumen=g('resumen');
  let montoSel = null;

  function refrescar(){
    const ok = montoSel>0;                       // la foto ya NO es obligatoria
    btn.disabled = !ok;
    btn.textContent = montoSel>0 ? `Enviar pago de ${Sudaderas.formatoDinero(montoSel)}` : 'Enviar pago';
    if(ok){
      resumen.style.display='block';
      resumen.innerHTML = archivo
        ? `Vas a enviar un pago de <b>${Sudaderas.formatoDinero(montoSel)}</b>. Revisa el monto y la foto antes de enviar.`
        : `Vas a enviar un pago de <b>${Sudaderas.formatoDinero(montoSel)}</b> <b>sin comprobante</b>. La academia lo verificará y podrás adjuntar la foto más adelante.`;
    } else {
      resumen.style.display='none';
    }
  }

  app.querySelectorAll('.mbtn').forEach(b=>{
    b.addEventListener('click', ()=>{
      app.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      if(b.dataset.monto==='otro'){
        montoInput.style.display='block'; montoInput.focus();
        montoSel = parseInt((montoInput.value||'').replace(/\D/g,'')) || null;
      } else {
        montoInput.style.display='none';
        montoSel = parseInt(b.dataset.monto);
      }
      refrescar();
    });
  });

  montoInput.addEventListener('input', ()=>{
    let v = parseInt(montoInput.value.replace(/\D/g,'')) || 0;
    if(v > saldoMax){ v = saldoMax; }
    montoInput.value = v ? v.toLocaleString('es-CO') : '';
    montoSel = v>0 ? v : null;
    refrescar();
  });

  function ponerFoto(f){
    archivo = f;
    prev.src = URL.createObjectURL(f);
    fotoCard.style.display='block';
    drop.style.display='none';
    refrescar();
  }
  file.addEventListener('change', ()=>{ if(file.files[0]) ponerFoto(file.files[0]); });
  g('cambiarFoto').addEventListener('click', ()=> file.click());
  g('quitarFoto').addEventListener('click', ()=>{
    archivo=null; file.value='';
    fotoCard.style.display='none'; drop.style.display='block';
    refrescar();
  });

  btn.addEventListener('click', async ()=>{
    if(!montoSel) return;
    if(montoSel > saldoMax) montoSel = saldoMax;
    btn.disabled = true; st.className='status';
    st.textContent = archivo ? 'Comprimiendo y enviando…' : 'Enviando…';
    try{
      let soporte = null;
      if(archivo){
        soporte = USAR_CLOUDINARY
          ? await Sudaderas.subirSoporteCloudinary(archivo)
          : await Sudaderas.soporteComoBase64(archivo);
      }
      await Sudaderas.agregarAbono(id, montoSel, soporte);   // la nube confirma
      const huboFoto = !!archivo;
      archivo = null;
      flashMsg = huboFoto
        ? '✅ Pago enviado. Quedó en revisión. Si te equivocaste, puedes anularlo abajo mientras no lo aprueben.'
        : '✅ Pago enviado sin comprobante. Quedó en revisión; envíale la foto a la academia cuando puedas.';
      registro = await Sudaderas.obtenerRegistro(id);
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    }catch(e){
      st.className='status err'; st.textContent = e.message || 'No se pudo enviar. Intenta otra vez.';
      btn.disabled = false;
    }
  });
}

/* Anular un pago propio en revisión (un solo listener para toda la página). */
document.addEventListener('click', async e=>{
  const an = e.target.closest('[data-anular]');
  if(!an) return;
  if(!confirm('¿Anular este pago? Podrás registrarlo de nuevo.')) return;
  try{
    await Sudaderas.anularAbono(id, an.dataset.anular);
    flashMsg = 'Pago anulado. Puedes registrarlo de nuevo cuando quieras.';
    registro = await Sudaderas.obtenerRegistro(id);
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }catch(err){ alert(err.message || 'No se pudo anular.'); }
});

cargar();
</script>
</body>
</html>

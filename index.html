<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e0f13">
<meta name="color-scheme" content="dark">
<title>Academia de Danzas Lazos Tricolor</title>
<link rel="icon" href="logo.png">
<script>
  // Entrada de app.academialazostricolor.com: abre el panel administrativo
  // (con su sección si viene en el enlace: #pagos, #alumnos…).
  // Solo los enlaces de una coreografía (#c=…) van a Coreografías,
  // que además tiene su propia dirección: /coreografias.html
  (function () {
    var h = location.hash || '';
    var destino = h.indexOf('#c=') === 0 ? 'coreografias.html' : 'admin.html';
    location.replace(destino + h);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0f13; color: #a4a9b8; font: 15px system-ui, sans-serif; }
  a { color: #f2c230; }
</style>
</head>
<body>
  <p>Abriendo… Si no pasa nada, entra al <a href="admin.html">panel</a> o a <a href="coreografias.html">Coreografías</a>.</p>
</body>
</html>
